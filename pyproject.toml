[project]
name = "cfd-case-generator"
version = "0.2.0"
description = "Turn a plain-English CFD problem description into a ready-to-run OpenFOAM case."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "openfoam: end-to-end tests that run generated cases in OpenFOAM (skipped when OpenFOAM is not sourced)",
]
